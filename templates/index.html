<!DOCTYPE html>
<html>
<head>
    <title>Bank Note Authentication</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h2>Bank Note Authentication</h2>
    <form action="/predict" method="post">
      <label>Variance</label>
<input type="number" step="0.01" name="variance" placeholder="Enter num: 0 to 7" min="-7" max="7" required>

<label>Skewness</label>
<input type="number" step="0.01" name="skewness" placeholder="Enter num: -14 to 13" min="-14" max="13" required>

<label>Curtosis</label>
<input type="number" step="0.01" name="curtosis" placeholder="Enter num: -5 to 18" min="-5" max="18" required>

<label>Entropy</label>
<input type="number" step="0.01" name="entropy" placeholder="Enter num: -9 to 3" min="-9" max="3" required>

        <button type="submit">Predict</button>
    </form>
    {% if prediction_text %}
        <h3>{{ prediction_text }}</h3>
    {% endif %}
</div>
</body>
</html>
